<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>G&amp;G — Glory &amp; Grace Partnership</title>
<meta name="description" content="G&G — the partnership platform for Glory & Grace church. Sign in with your email and step into the live Main Portal." />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" type="image/png" href="assets/gg-logo.png" />
<link rel="apple-touch-icon" href="assets/gg-icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="G&amp;G" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="btn btn-primary btn-small join-partners" href="https://upgrade.chat/gandgpartners" target="_blank" rel="noopener noreferrer">Join Partners</a>

    <a href="#top" class="brand" aria-label="Glory &amp; Grace">
      <img src="assets/gg-logo.png" alt="Glory &amp; Grace" class="brand-icon" />
    </a>

    <nav class="header-nav">
      <!-- Rooms: a clickable menu in the top right -->
      <div class="menu" id="roomsMenu">
        <button class="btn btn-ghost btn-small menu-trigger" id="roomsTrigger" aria-haspopup="true" aria-expanded="false">
          Rooms <span class="caret">▾</span>
        </button>
        <div class="menu-panel rooms-panel" id="roomsPanel" hidden><!-- rendered by app.js --></div>
      </div>
    </nav>
  </div>
</header>

<main id="top">
  <section class="portal">
    <div class="chat-pane">
      <div class="chat-header">
        <span id="chatTitle" class="chat-title">Main Portal</span>
        <span id="presence" class="presence"></span>
      </div>
      <div id="chatMessages" class="chat-messages"></div>
      <form id="chatForm" class="chat-form">
        <input id="mediaInput" type="file" accept="image/*,video/*" hidden />
        <button type="button" id="attachBtn" class="btn btn-outline btn-small chat-attach" title="Send a photo or video" aria-label="Send a photo or video" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input id="chatInput" type="text" placeholder="Message the portal…" autocomplete="off" maxlength="2000" disabled />
        <button type="submit" class="btn btn-primary btn-small" disabled>Send</button>
      </form>
    </div>
  </section>
</main>

<!-- Bottom bar: the account / sign-in bar lives here now, alongside GIVE. -->
<footer class="bottom-bar">
  <div class="bottom-bar-inner">
    <div id="profileBar" class="profile-bar"><!-- rendered by app.js --></div>
    <a class="btn btn-give" href="https://www.paypal.com/ncp/payment/6NG4Q34ACBTCG" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20.5S3.5 15.2 3.5 9.3A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 8.5 1.9c0 5.9-8.5 11.2-8.5 11.2z"/></svg>
      GIVE
    </a>
  </div>
</footer>

<!-- Full-quality photo viewer: tap a photo to see it big; tap again to close.
     Shows the original image itself — never navigates to a storage URL. -->
<div id="lightbox" class="lightbox" hidden aria-hidden="true">
  <img id="lightboxImg" alt="" />
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
